<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Hooded hacker with a hidden face" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1F3F77"/>
      <stop offset="0.6" stop-color="#112A55"/>
      <stop offset="1" stop-color="#091630"/>
    </radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2744"/>
      <stop offset="1" stop-color="#0E1730"/>
    </linearGradient>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#04091A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#47D6FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#47D6FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><circle cx="80" cy="80" r="76"/></clipPath>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#bg)"/>

  <g clip-path="url(#c)">
    <!-- faint screen glow from below -->
    <ellipse cx="80" cy="150" rx="62" ry="26" fill="url(#glow)"/>

    <!-- shoulders -->
    <path d="M14 160 C16 124 46 110 80 110 C114 110 144 124 146 160 Z" fill="#101A32" stroke="#2A4175" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- pocket -->
    <path d="M52 152 C64 138 96 138 108 152" fill="none" stroke="#24385F" stroke-width="2.5" stroke-linecap="round"/>

    <!-- hood -->
    <path d="M40 116 C32 70 48 30 80 28 C112 30 128 70 120 116 C106 106 54 106 40 116 Z" fill="url(#hood)" stroke="#34508F" stroke-width="3" stroke-linejoin="round"/>

    <!-- the face: only darkness -->
    <path d="M58 100 C51 70 60 48 80 48 C100 48 109 70 102 100 C94 109 66 109 58 100 Z" fill="url(#void)"/>

    <!-- cold light on the edge of the hood -->
    <path d="M44 108 C38 72 50 38 80 33" fill="none" stroke="#47D6FF" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <path d="M116 108 C122 72 110 38 80 33" fill="none" stroke="#47D6FF" stroke-width="2" stroke-linecap="round" opacity=".3"/>

    <!-- drawstrings -->
    <path d="M70 108 L67 130" stroke="#9DB4E6" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M90 108 L93 130" stroke="#9DB4E6" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="67" cy="131" r="2.6" fill="#9DB4E6"/>
    <circle cx="93" cy="131" r="2.6" fill="#9DB4E6"/>
  </g>

  <circle cx="80" cy="80" r="76" fill="none" stroke="#3B5CA8" stroke-width="3"/>
</svg>
