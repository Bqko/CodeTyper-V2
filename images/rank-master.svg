<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Golden crown" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFF1BE"/><stop offset="1" stop-color="#F2BE45"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#E8A920"/>
    </linearGradient>
    <clipPath id="c"><circle cx="80" cy="80" r="76"/></clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- halo -->
    <ellipse cx="80" cy="30" rx="30" ry="8" fill="none" stroke="#FFFFFF" stroke-width="5" opacity=".9"/>
    <!-- crown -->
    <path d="M38 112 L32 64 L58 86 L80 54 L102 86 L128 64 L122 112 Z" fill="url(#gold)" stroke="#A9741B" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M38 112 H122 V128 H38 Z" fill="#E0A82E" stroke="#A9741B" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- tips -->
    <circle cx="32" cy="62" r="6" fill="#FFF6CF" stroke="#A9741B" stroke-width="2.5"/>
    <circle cx="80" cy="52" r="6" fill="#FFF6CF" stroke="#A9741B" stroke-width="2.5"/>
    <circle cx="128" cy="62" r="6" fill="#FFF6CF" stroke="#A9741B" stroke-width="2.5"/>
    <!-- jewels -->
    <circle cx="80" cy="98" r="7" fill="#E5533D" stroke="#A9741B" stroke-width="2.5"/>
    <circle cx="56" cy="100" r="5" fill="#4C9BE8" stroke="#A9741B" stroke-width="2.5"/>
    <circle cx="104" cy="100" r="5" fill="#4C9BE8" stroke="#A9741B" stroke-width="2.5"/>
  </g>
  <circle cx="80" cy="80" r="76" fill="none" stroke="#D49A22" stroke-width="3"/>
</svg>
